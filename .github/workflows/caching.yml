name: Caching
run-name: Caching
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 3,6"
jobs:
  Windows-MSYS2-MINGW64-Caching:
    name: Windows MSYS2/MINGW64 Caching
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          location: C:\msys2
      - name: Install dependencies
        run: |
          cd '${{ github.workspace }}' && ./dist/win/install_deps.sh
          du -sh 'C:\msys2'
      - name: Save MSYS2 cache
        uses: actions/cache/save@v6
        with:
          key: spek-x-msys2-mingw64-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\msys2
